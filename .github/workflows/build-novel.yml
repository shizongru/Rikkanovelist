name: Build RikkaNovel APK

on:
  push:
    branches: [master, main, novel-lite]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform (canary channel)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --channel=3 "platforms;android-37.1" "build-tools;36.0.0"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK (signed with debug key)
        run: ./gradlew :app:assembleRelease --no-daemon || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkanovel-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
