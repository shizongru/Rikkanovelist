name: Build RikkaNovel APK

on:
  push:
    branches: [master, main, novel-lite]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android 37 platform (canary channel)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --channel=3 "platforms;android-37.1" "build-tools;36.0.0"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rikkanovel-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly
          name: RikkaNovel Nightly
          prerelease: true
          body: |
            自动构建 APK（commit `${{ github.sha }}`）

            > ⚠️ 开发版本，仅供测试。点击下方 asset 直接下载安装（arm64 手机选 arm64-v8a）。
          files: |
            app/build/outputs/apk/debug/*.apk
